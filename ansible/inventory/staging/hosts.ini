# Staging inventory (AWS SSM)
#
# Placeholders only: uncomment the examples and fill in your staging instances
# before deploying. Empty groups are valid - Ansible reports "no hosts matched"
# and makes no changes.
#
# INI format:
#   [group_name]
#   host-name ansible_host=<ip> key=value key=value ...

[linux_hosts]
# staging-linux-01 ansible_host=10.20.11.11 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket>

[windows_hosts]
# staging-win-01 ansible_host=10.20.11.21 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket> ansible_shell_type=powershell
