# =============================================================================
# On-prem inventory (deploy_onprem=true)
# Play: ansible/roles/alloy_agent/tasks/deploy_alloy_onprem.yml, imported by
# ansible/playbooks/deploy_alloy.yml
# =============================================================================
# This inventory is intentionally separate from dev/staging/prod. Role-mode
# runs do not read it.
#
# The on-prem play targets the "linux_servers" group and supports RedHat and
# Debian only. Add your on-prem hosts below.
#
# SSH example:
# onprem-db-01 ansible_host=10.20.30.40 ansible_user=ansible
#
# AWS SSM example (same connection style as the other inventories):
# onprem-db-01 ansible_host=10.20.30.40 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket>

[linux_servers]
# onprem-db-01 ansible_host=10.20.30.40 ansible_user=ansible

[linux_servers:vars]
# ansible_python_interpreter=/usr/bin/python3
