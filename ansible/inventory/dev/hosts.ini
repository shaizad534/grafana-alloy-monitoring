# Dev inventory (AWS SSM)
#
# Placeholders only: uncomment the examples and fill in your dev instances
# before deploying. Empty groups are valid - Ansible reports "no hosts matched"
# and makes no changes.
#
# INI format:
#   [group_name]
#   host-name ansible_host=<ip> key=value key=value ...
#
# Empty lines and lines starting with # are ignored.
# The `all` group is implicit: every host belongs to it automatically.

[linux_hosts]
# ubuntu-linux-dev-01 ansible_host=10.10.11.11 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket>

# ---------------------------------------------------------------------------
# Windows targets (uncomment and adjust before use)
# ---------------------------------------------------------------------------
# [windows_hosts]
# windows-dev-01 ansible_host=10.10.11.21 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket> ansible_shell_type=powershell
#
# windows-server-2022 ansible_host=10.10.11.22 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket> ansible_shell_type=powershell
#
# windows-server-2019 ansible_host=10.10.11.23 ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-xxxxxxxxxxxxxxxxx ansible_aws_ssm_region=<aws-region> ansible_aws_ssm_bucket_name=<ssm-transfer-bucket> ansible_shell_type=powershell

# ---------------------------------------------------------------------------
# Optional per-database groups (useful with the HOST_LIMIT parameter)
# ---------------------------------------------------------------------------
# [db_mysql]
# mysql-dev-01 ansible_host=10.10.11.11
#
# [db_mssql]
# mssql-dev-01 ansible_host=10.10.11.12
#
# [db_oracle]
# oracle-dev-01 ansible_host=10.10.11.13
#
# [db_mongodb]
# mongodb-dev-01 ansible_host=10.10.11.14

