[defaults]
inventory = inventory/dev
# Absolute path kept for reference (local testing on the cloud controller):
# roles_path = /root/grafana-alloy-monitoring/ansible/roles
# Portable path: resolved relative to this ansible.cfg, so it works on any
# machine/Jenkins agent (e.g. ${WORKSPACE}/ansible/roles).
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
gathering = smart
stdout_callback = default
display_skipped_hosts = False
deprecation_warnings = False
command_warnings = False
forks = 25
timeout = 60

[ssh_connection]
pipelining = True
